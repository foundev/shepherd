name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # --ignore-scripts installs the way npm 12, pnpm and Bun do by default,
      # so a dependency that needs an install script or a compile fails here.
      - run: npm ci --ignore-scripts
      - name: Configure git for worktree tests
        run: |
          git config --global user.email ci@example.com
          git config --global user.name "Shepherd CI"
          git config --global init.defaultBranch main
      - run: npm test
