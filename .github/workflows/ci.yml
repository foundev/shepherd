name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # windows-latest ships Visual Studio 2026, which npm's bundled node-gyp
      # (11.x) can't detect, so node-pty fails to compile. Use a newer node-gyp.
      - name: Use node-gyp with VS 2026 support
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npm install -g node-gyp@13.1.0
          echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Configure git for worktree tests
        run: |
          git config --global user.email ci@example.com
          git config --global user.name "Shepherd CI"
          git config --global init.defaultBranch main
      - run: npm test
