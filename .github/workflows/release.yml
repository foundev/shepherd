name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - run: npm test
      # npm >= 11.5.1 required for GitHub OIDC -> npm trusted publishing
      - run: npm install -g npm@latest
      # No NODE_AUTH_TOKEN: auth comes from the GitHub OIDC token via the
      # trusted publisher configured on npmjs.com for this repo + workflow.
      # No --provenance: Sigstore provenance requires a public source repo
      # and foundev/shepherd is private. Re-add it if the repo goes public.
      - run: npm publish --access public
